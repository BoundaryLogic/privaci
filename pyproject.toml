[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privaci"
version = "1.3.0"
description = "In-VPC PostgreSQL masking and anonymization engine"
readme = "README.md"
license = { text = "Elastic License 2.0" }
requires-python = ">=3.12"
authors = [{ name = "BoundaryLogic", email = "hello@boundarylogic.io" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    "asyncpg==0.31.0",
    # CEL sandbox for optional column ``when:`` guards.
    "cel-python==0.5.0",
    # Pinned alongside typer: Click 8.4 broke Typer 0.15 (make_metavar(ctx)).
    # Keep this range until a Typer release is validated against newer Click.
    "click>=8.1.7,<8.5",
    "cryptography==48.0.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "typer==0.27.0",
]

[project.optional-dependencies]
nlp = [
    "spacy==3.8.14",
]
dev = [
    "black==26.5.1",
    "cosmic-ray==8.4.6",
    "hypothesis==6.161.0",
    "import-linter==2.13",
    "isort==8.0.1",
    "mkdocs-material==9.7.7",
    "mkdocs==1.6.1",
    "mypy==1.15.0",
    "pip-audit==2.10.1",
    "pip-tools==7.6.0",
    "pre-commit==4.6.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest==9.1.1",
    "ruff==0.15.22",
    "types-PyYAML==6.0.12.20241230",
]

[project.scripts]
privaci = "privaci.cli.app:main"

[project.entry-points."privaci.plugins"]
# Commercial layer registers implementations here.

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["privaci.spikes", "privaci.spikes.*"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream packages (e.g. privaci-commercial) get
# the engine's types when they build against privaci.contracts.
privaci = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real PostgreSQL instance",
    "slow: long-running tests",
    "spike: Week-1 architecture validation (see docs/spikes/)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/privaci"]
branch = true
# Paths must match measured files under ``pytest --cov=src`` (``src/privaci/...``).
omit = [
    "*/__main__.py",
    "*/mask/__init__.py",
    "*/stream/__init__.py",
    "*/schema/__init__.py",
    "*/pipeline/__init__.py",
    "*/autodetect/__init__.py",
    "*/observability/__init__.py",
    "*/preflight/__init__.py",
    "*/verify/__init__.py",
    "*/verify/runner.py",
    "*/verify/structural.py",
    "*/spikes/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["privaci", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Optional/untyped third-party libs (cloud SDKs are lazy-imported per scheme).
module = [
    "spacy",
    "spacy.*",
    "asyncpg",
    "asyncpg.*",
    "celpy",
    "celpy.*",
    "lark",
    "lark.*",
    "boto3",
    "botocore",
    "botocore.*",
    "azure.*",
    "hvac",
    "hvac.*",
    "prometheus_client",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/**" = ["S101", "S105", "S108"]
"src/privaci/secrets/**" = ["A005"]
"scripts/check_*.py" = ["E402"]
"scripts/security_ast/**" = ["N802"]  # ast.NodeVisitor visit_* names

[tool.ruff.lint.isort]
known-first-party = ["privaci", "tests"]

# Import contracts (constitution Article VIII).
[tool.importlinter]
root_package = "privaci"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Mask must not import CLI or pipeline orchestration"
type = "forbidden"
source_modules = ["privaci.mask"]
forbidden_modules = ["privaci.cli", "privaci.pipeline"]

[[tool.importlinter.contracts]]
name = "Stream must not import CLI or pipeline orchestration"
type = "forbidden"
source_modules = ["privaci.stream"]
forbidden_modules = ["privaci.cli", "privaci.pipeline"]

[[tool.importlinter.contracts]]
name = "Catalog must not import CLI or pipeline orchestration"
type = "forbidden"
source_modules = ["privaci.catalog"]
forbidden_modules = ["privaci.cli", "privaci.pipeline"]

[[tool.importlinter.contracts]]
name = "Contracts must not import CLI or pipeline"
type = "forbidden"
source_modules = ["privaci.contracts"]
forbidden_modules = [
    "privaci.cli",
    "privaci.pipeline",
    "privaci.stream",
    "privaci.catalog",
    "privaci.schema",
]

[[tool.importlinter.contracts]]
name = "Engine must not import packaging package"
type = "forbidden"
source_modules = [
    "privaci",
]
forbidden_modules = [
    "privaci_commercial",
]
