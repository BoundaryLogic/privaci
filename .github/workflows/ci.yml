name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history so PR base.sha is reachable for document-registry D11.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: black
        run: black --check src/ tests/

      - name: isort
        run: isort --check-only --profile black src/ tests/

      - name: ruff
        run: ruff check src/ tests/

      - name: mypy
        run: mypy src/ --strict

      - name: pack trust-anchor guard
        run: python scripts/check_pack_key.py

      - name: contract version guard
        run: python scripts/check_contract_version.py

      - name: implicit commercial contract guard
        run: python scripts/check_implicit_contracts.py

      - name: git history email guard
        run: python scripts/check_git_emails.py

      - name: public repo language guard
        run: |
          python scripts/check_public_repo_language.py
          python scripts/check_public_repo_language.py --git-log 30

      - name: generate docs check
        run: python scripts/generate_docs.py --check

      - name: MkDocs docs/ link boundary
        run: python scripts/check_mkdocs_doc_links.py

      - name: CI workflow tool parity
        run: python scripts/check_ci_workflow_parity.py

      - name: document registry (PR coupling)
        if: github.event_name == 'pull_request'
        run: >
          python scripts/check_doc_registry.py
          --base-sha "${{ github.event.pull_request.base.sha }}"

      - name: document registry (structure only)
        if: github.event_name != 'pull_request'
        run: python scripts/check_doc_registry.py --skip-coupling

      - name: file limits
        run: python scripts/check_file_limits.py

      - name: security AST
        run: python scripts/check_security_ast.py

      - name: Setup Node (jscpd)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: duplicate code
        run: ./scripts/check-duplicates.sh

      - name: typos
        uses: crate-ci/typos@685eb3d55be2f85191e8c84acb9f44d7756f84ab  # v1.29.4

      # Use the OSS CLI (matches ci-local / pre-commit). gitleaks-action requires
      # an org GITLEAKS_LICENSE secret; the binary does not.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver="8.24.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks
        run: gitleaks detect --source . --verbose

      - name: import contracts
        run: lint-imports

      - name: pytest (unit)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=85 -m "not integration"

      - name: critical coverage floors
        run: python scripts/check_coverage_floors.py

      - name: pip-audit
        run: pip-audit --requirement requirements.txt

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: helm lint
        run: helm lint deploy/helm/privaci

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,nlp]"
          python -m spacy download en_core_web_sm

      - name: Start Postgres (compose.dev.yml)
        run: docker compose -f compose.dev.yml up -d --wait

      - name: pytest (integration, excluding slow)
        run: pytest -m "integration and not slow" -q

      - name: Stop Postgres
        if: always()
        run: docker compose -f compose.dev.yml down -v

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Dependabot (and other actors without Dependabot-mirrored secrets) get an
      # empty COMMERCIAL_REPO_READ_TOKEN. Key off token presence — not
      # github.actor — so maintainer "Re-run" on Dependabot PRs still skips.
      - name: Detect commercial docs token
        id: commercial
        env:
          COMMERCIAL_REPO_READ_TOKEN: ${{ secrets.COMMERCIAL_REPO_READ_TOKEN }}
        run: |
          if [ -n "${COMMERCIAL_REPO_READ_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout commercial docs source
        if: steps.commercial.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: BoundaryLogic/privaci-commercial
          token: ${{ secrets.COMMERCIAL_REPO_READ_TOKEN }}
          path: commercial-src
          ref: main

      - name: Verify generated reference docs are current
        run: python scripts/generate_docs.py --check

      - name: Build documentation site
        if: steps.commercial.outputs.available == 'true'
        env:
          COMMERCIAL_DOCS_SOURCE: commercial-src
        run: ./scripts/docs_build.sh

      - name: Skip note when commercial token unavailable
        if: steps.commercial.outputs.available != 'true'
        run: |
          echo "Skipped full MkDocs build: COMMERCIAL_REPO_READ_TOKEN is empty"
          echo "(common on Dependabot PRs — add the secret under"
          echo "Settings → Secrets and variables → Dependabot to enable)."
          echo "generate_docs --check still ran."
