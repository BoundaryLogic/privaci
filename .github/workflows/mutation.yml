name: Mutation (critical)

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-mask-config:
    runs-on: ubuntu-latest
    # Warn-only until kill-score calibrated (OpenSpec D8).
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Critical mutation
        run: ./scripts/mutation-critical.sh
        timeout-minutes: 45
