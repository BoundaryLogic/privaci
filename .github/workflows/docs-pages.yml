name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/generate_docs.py"
      - "scripts/sync_commercial_docs.py"
      - "scripts/docs_build.sh"
      - "src/**"
      - ".github/workflows/docs-pages.yml"
  repository_dispatch:
    types: [rebuild-commercial-docs]
  schedule:
    # Rebuild with latest commercial docs when dispatch is missed
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Checkout commercial docs source
        uses: actions/checkout@v4
        with:
          repository: BoundaryLogic/privaci-commercial
          token: ${{ secrets.COMMERCIAL_REPO_READ_TOKEN }}
          path: commercial-src
          ref: main

      - name: Build site (sync commercial docs at build time)
        env:
          COMMERCIAL_DOCS_SOURCE: commercial-src
        run: ./scripts/docs_build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
