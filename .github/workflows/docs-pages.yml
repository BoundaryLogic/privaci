# Optional GitHub Pages mirror (boundarylogic.github.io/privaci/).
# Production: docs.boundarylogic.io is Cloudflare Pages — operator setup in
# privaci-commercial (private) and boundarylogic-web/docs/deploying-cloudflare-pages.md.
name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/generate_docs.py"
      - "scripts/sync_commercial_docs.py"
      - "scripts/docs_build.sh"
      - "src/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Checkout commercial docs source
        uses: actions/checkout@v4
        with:
          repository: BoundaryLogic/privaci-commercial
          token: ${{ secrets.COMMERCIAL_REPO_READ_TOKEN }}
          path: commercial-src
          ref: main

      - name: Build site (sync commercial docs at build time)
        env:
          COMMERCIAL_DOCS_SOURCE: commercial-src
        run: ./scripts/docs_build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail when GitHub Pages deploy is exhausted
        if: >-
          steps.deployment.outcome == 'failure'
          && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "GitHub Pages deploy failed after two attempts (transient API errors are common)."
          exit 1
