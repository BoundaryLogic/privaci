name: Container hygiene

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            container:
              - 'Dockerfile'
              - 'requirements.txt'
              - 'requirements-nlp.txt'
              - 'requirements-dev.txt'
              - 'pyproject.toml'
              - 'deploy/**'
              - 'compose*.yml'
              - '.dockerignore'

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12

  hadolint:
    name: hadolint
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  trivy:
    name: Trivy filesystem scan
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan Dockerfile and requirements for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          skip-dirs: src,tests,docs,scripts,.github

  hygiene-gate:
    name: Hygiene gate
    needs: [changes, actionlint, hadolint, trivy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate hygiene job results
        env:
          CHANGES: ${{ needs.changes.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          HADOLINT: ${{ needs.hadolint.result }}
          TRIVY: ${{ needs.trivy.result }}
        run: |
          failed=0
          if [ "${CHANGES}" = "failure" ] || [ "${CHANGES}" = "cancelled" ]; then
            echo "changes job ${CHANGES}"
            failed=1
          fi
          for job in ACTIONLINT HADOLINT TRIVY; do
            result="${!job}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "${job} ${result}"
              failed=1
            fi
          done
          exit "${failed}"
