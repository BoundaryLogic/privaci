name: Sync commercial docs

on:
  repository_dispatch:
    types: [sync-commercial-docs]
  schedule:
    # Daily fallback when dispatch is missed
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-commercial-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v4

      - name: Checkout commercial docs source
        uses: actions/checkout@v4
        with:
          repository: BoundaryLogic/privaci-commercial
          token: ${{ secrets.COMMERCIAL_REPO_READ_TOKEN }}
          path: commercial-src
          ref: main

      - name: Sync publishable docs into docs/commercial/
        run: python scripts/sync_commercial_docs.py --source commercial-src

      - name: Commit and push when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commercial/
          if git diff --staged --quiet; then
            echo "No commercial doc changes to publish."
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
Sync commercial docs from privaci-commercial main.

Automated publish to docs.boundarylogic.io/commercial/.
EOF
)"
          git push
