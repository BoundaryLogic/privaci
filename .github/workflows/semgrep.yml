name: Semgrep

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.110.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run Semgrep (fail closed on ERROR findings)
        # Parity with scripts/ci-local.sh --security (semgrep CLI + --error).
        run: >
          semgrep scan
          --config=.semgrep.yml
          --config=auto
          --error
          --severity=ERROR
          src/privaci
