name: Semgrep

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.110.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Semgrep (fail closed on ERROR findings)
        # Parity with default scripts/ci-local.sh (same flags + image pin).
        run: >
          semgrep scan
          --config=.semgrep.yml
          --config=auto
          --error
          --severity=ERROR
          src/privaci
